    <script>
      (function () {

        var ROOT = document.querySelector('[data-composition-id="03-la-cascada"]');
        function el(id) {

        var D = 9; // data-duration — fijo aguas arriba, no se toca
        var FPS = 30;

        /* ── geometría medida de la lámina (1772×1514) ───────────────────
              stage 1000×632 · viewBox "0 75 1772 1120" → s = 1000/1772     */
        var S = 1000 / 1772;
        var CX = 500; // centro del stage, x
        var CY = 316; // centro del stage, y
        // viewport-change, forma de un solo wrapper: T = -offset × escala.
        // La lámina mide exactamente el stage, así que cada pierna se recorta
        // al desborde disponible (CX·(S−1), CY·(S−1)): si la cámara pide más,
        // asomaría el borde del papel y el viaje se vería como un error.
        function aim(platex, platey, scale) {
          var mx = CX * (scale - 1);
          var my = CY * (scale - 1);
          var tx = -(platex * S - CX) * scale;
          var ty = -((platey - 75) * S - CY) * scale;
          return {
            x: Math.max(-mx, Math.min(mx, tx)),
            y: Math.max(-my, Math.min(my, ty)),
            scale: scale,
          };
        }
        var SUBES = aim(950, 289, 1.38); // subestación bermellón (queda alta: tope de recorte)
        var BOMBAS = aim(949.5, 618.5, 1.38); // casa de bombas, centrada

        var world = el("c03-la-cascada-world");
        gsap.set(world, { transformOrigin: "50% 50%", x: 0, y: 0, scale: 1 });

        /* ── longitudes medidas de las líneas de dependencia ─────────────
              getTotalLength() sobre la geometría real; la polilínea sirve de
              respaldo aritmético si el path vive en <defs> sin caja.        */
        function polyLength(d) {
          var n = d.match(/-?\d+(?:\.\d+)?/g).map(Number);
          var t = 0;
          for (var i = 2; i < n.length; i += 2) {
            t += Math.hypot(n[i] - n[i - 2], n[i + 1] - n[i - 1]);
          }
          return t;
        }
        function armStroke(node, fallback) {
          var len = 0;
          if (typeof node.getTotalLength === "function") {
            try {
              len = node.getTotalLength();
            } catch (e) {
              len = 0;
            }
          }
          if (!len || !isFinite(len)) len = fallback;
          // dash + hueco mayor que el trazo: en reposo no asoma ni el remate
          node.style.strokeDasharray = len + " " + (len + 64);
          node.style.strokeDashoffset = String(len + 32);
          return len;
        }

        var mL1 = el("c03-la-cascada-mL1");
        var mLA = el("c03-la-cascada-mLA");
        var mLB = el("c03-la-cascada-mLB");

        armStroke(mLB, polyLength(mLB.getAttribute("d")));

        var mCb = el("c03-la-cascada-mCb");

        /* ═══ SCENE 1 (0.0–2.4s) · la primera pierna del viaje ══════════
           El viaje de la cámara ES la relación causa-efecto: LEG 1a se clava

        );

        // LEG 1b — la cámara sigue el trazo, misma escala.

        tl.fromTo(

        /* ═══ SCENE 3 (3.4–5.8s) · las dos líneas restantes ═════════════
           LEG 2 — la cámara retrocede lo justo para que los dos invernaderos
           entren completos (multi-phase-camera, fase de pull).             */
        tl.to(world, { x: 56, y: 30, scale: 1.12, duration: 1.6, ease: "power2.inOut" }, 3.3);

        tl.to(mLA, { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, 3.45);

           LEG 3 — la cámara vuelve al encuadre completo y queda quieta.
           handoff_out: escala 1.0, opacidad 1, centrado, quieto al corte.  */
        tl.to(world, { x: 0, y: 0, scale: 1, duration: 1.4, ease: "power2.inOut" }, 5.6);

        // count-up: filas de cuadro precalculadas (el mismo mecanismo del
        // componente del registro). Una escritura por cuadro, cero callbacks
        // → cualquier seek reproduce el mismo entero.
        var countEase = gsap.parseEase("sine.inOut");
        function countUp(valNode, boxNode, from, to, at, dur) {
          var last = Math.max(1, Math.round(dur * FPS));
          for (var f = 0; f <= last; f += 1) {
            var v = Math.round(from + (to - from) * countEase(f / last));
            tl.set(valNode, { textContent: String(v) }, at + dur * (f / last));
          }
          gsap.set(boxNode, { transformOrigin: "0% 74%" });
          tl.to(boxNode, { scale: 1.045, duration: 0.15, ease: "power3.out" }, at + dur);
          tl.to(boxNode, { scale: 1, duration: 0.28, ease: "power2.out" }, at + dur + 0.15);
        }

        countUp(el("c03-la-cascada-k1val"), el("c03-la-cascada-k1num"), 1, 4, 5.9, 0.85);
        tl.fromTo(

        // la línea que importa: 3 de los 4 no recibieron daño
        tl.fromTo(

        tl.fromTo(

        tl.fromTo(

        tl.fromTo(

          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out" },
          6.25,
        );
        countUp(el("c03-la-cascada-k2val"), el("c03-la-cascada-k2num"), 0, 37, 6.3, 0.9);
        tl.fromTo(
          el("c03-la-cascada-k2sub"),
          { opacity: 0, x: 14 },
          { opacity: 1, x: 0, duration: 0.36, ease: "power2.out" },
          6.62,
        );

        /* ═══ SCENE 5 (7.4–9.0s) · la frase del panel, literal ══════════ */
        tl.fromTo(
          el("c03-la-cascada-div3"),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power2.out" },
          7.2,
        );
        tl.fromTo(
          el("c03-la-cascada-sent1"),
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          7.35,
        );
        tl.fromTo(
          el("c03-la-cascada-sent2"),
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          7.52,
        );
        // subrayado dibujado a mano, en ocre (css-marker-patterns · scribble)
        tl.to(scribble, { strokeDashoffset: 0, duration: 0.65, ease: "power1.inOut" }, 7.95);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["03-la-cascada"] = tl;
      })();
    </script>
