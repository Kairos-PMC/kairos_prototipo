  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";

      var tl = gsap.timeline({ paused: true });

      /* ─────────────────────────────────────────────────────────────────────
         Geometría medida sobre los plates (1772x1514 @2x, alineados pixel a
         pixel). El plano se dibuja a 880 x 751.86 con origen (520, 190).
         Región de la subestación en px del plate: x 800–1100, y 128–390.5.
         Centroide visual del recuadro (el punto del clic): plate (950, 288.5).
         ──────────────────────────────────────────────────────────────────── */
      var PW = 880,
        PH = 751.86;
      var SUB_L = 397.29,
        SUB_R = 546.28,
        SUB_T = 63.56,
        SUB_B = 193.91;
      var CX = 471.78,
        CY = 143.28;
      var CLICK_X = 520 + CX; // 991.78
      var CLICK_Y = 190 + CY; // 333.28

      var reveal = document.getElementById("clic-reveal");
      var cursor = document.getElementById("clic-cursor");

      // El recorte va de un rectángulo de área cero en el punto del clic al
      // rectángulo exacto de la subestación. Se interpola como propiedad de
      // estilo (nunca por onUpdate: seek() suprime los callbacks y el revelado
      // no se pintaría al renderizar fotograma a fotograma).
      function insetAt(p) {
        var top = CY + (SUB_T - CY) * p;
        var left = CX + (SUB_L - CX) * p;
        var right = PW - CX + (PW - SUB_R - (PW - CX)) * p;
        var bottom = PH - CY + (PH - SUB_B - (PH - CY)) * p;
        return (
          "inset(" +
          top.toFixed(2) +
          "px " +
          right.toFixed(2) +
          "px " +
          bottom.toFixed(2) +
          "px " +
          left.toFixed(2) +
          "px)"
        );
      }
      var CLIP_CERRADO = insetAt(0);
      var CLIP_ABIERTO = insetAt(1);

      // El recorte y la compresión del recuadro pivotan sobre el MISMO punto
      // (el del clic), así que el contenido nunca se sale del recorte.
      gsap.set(reveal, { transformOrigin: CX + "px " + CY + "px", scale: 1 });
      reveal.style.clipPath = CLIP_CERRADO;

      // Tip-targeting: la punta de la flecha vive en (21%, 14%) de su caja;
      // se ancla una sola vez para que todo x/y posterior coloque la PUNTA.
      gsap.set(cursor, { xPercent: -21, yPercent: -14, transformOrigin: "21% 14%" });

      /* ── Scene 1 · 0.0–1.6s — la fila de KPIs baja, toda en ceros ──────── */
      tl.fromTo(
        "#clic-kpi-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.78, ease: "power3.out" },
        0.05
      );

      var tarjetas = ["#clic-kpi-1", "#clic-kpi-2", "#clic-kpi-3", "#clic-kpi-4"];
      tarjetas.forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { opacity: 0, y: -30 },
          { opacity: 1, y: 0, duration: 0.66, ease: "power3.out" },
          0.14 + i * 0.14
        );
      });

      tl.fromTo(
        ["#clic-div-a", "#clic-div-b"],
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out" },
        0.86
      );

      // Los subrayados de "reaccionó" nacen apagados; se dibujan en Scene 4.
      tl.set(["#clic-mark-1", "#clic-mark-3"], { scaleX: 0 }, 0);

      // El sufijo "M" no existe mientras la cifra es $ 0.
      tl.set("#clic-suf-repo", { opacity: 0 }, 0);

      // La banda de la tesis espera fuera de cuadro, abajo.
      tl.set("#clic-banda", { y: 300 }, 0);
      tl.set("#clic-banda-rule", { scaleX: 0 }, 0);
      tl.set(".clic-word", { opacity: 0, y: 24 }, 0);

      /* ── Scene 2 · 1.6–3.0s — el cursor entra por la derecha ───────────── */
      // Una sola vectorial continua; x e y con eases distintos = curva larga.
      // APPROACH_DUR 1.40s, y termina exactamente cuando empieza la presión.
      tl.fromTo(
        cursor,
        { x: 2080 },
        { x: CLICK_X, duration: 1.4, ease: "power1.inOut" },
        1.6
      );
      tl.fromTo(
        cursor,
        { y: 690 },
        { y: CLICK_Y, duration: 1.4, ease: "power3.inOut" },
        1.6
      );

      /* ── Scene 3 · 3.0–4.0s — EL MOVIMIENTO FIRMA: el clic ─────────────── */
      var CLICK_AT = 3.0;
      var PRESS_DOWN = 0.12;
      var IGNITE_AT = CLICK_AT + PRESS_DOWN; // 3.12

      // Depresión sincronizada: mismo instante, misma duración. El cursor es
      // el actor y se comprime más; el recuadro es el receptor.
      tl.to(cursor, { scale: 0.86, duration: PRESS_DOWN, ease: "power2.in" }, CLICK_AT);
      tl.to(reveal, { scale: 0.955, duration: PRESS_DOWN, ease: "power2.in" }, CLICK_AT);

      // La ignición: en el mismo fotograma del fondo de la presión, la región
      // de la subestación se revela desde el plate caído — azul → bermellón,
      // con su rayado y su X — radiando desde el punto del clic.
      tl.set(reveal, { clipPath: CLIP_CERRADO }, 0);
      tl.to(
        reveal,
        { clipPath: CLIP_ABIERTO, duration: 0.26, ease: "power3.out" },
        IGNITE_AT
      );

      // Liberación: cursor y recuadro vuelven juntos, con sobrepaso corto.
      tl.to(cursor, { scale: 1, duration: 0.5, ease: "back.out(1.7)" }, IGNITE_AT);
      tl.to(reveal, { scale: 1, duration: 0.5, ease: "back.out(1.7)" }, IGNITE_AT);

      // Onda expansiva desde el punto del clic. Cuadrada: el sistema no tiene
      // un solo elemento circular, y el filete es tinta (el bermellón sólo
      // puede usarlo una instalación).
      tl.set(["#clic-onda-1", "#clic-onda-2"], { scale: 1, opacity: 0 }, 0);
      tl.fromTo(
        ["#clic-onda-1", "#clic-onda-2"],
        { scale: 1, opacity: 0.5 },
        {
          scale: 2.6,
          opacity: 0,
          duration: 0.66,
          ease: "power2.out",
          stagger: 0.09,
          immediateRender: false,
        },
        IGNITE_AT
      );

      // El cursor se aparta y se retira de cuadro: no se queda estorbando.
      tl.to(cursor, { x: CLICK_X + 96, y: CLICK_Y + 68, duration: 0.4, ease: "power2.out" }, 3.42);
      tl.to(cursor, { x: 2120, y: 860, duration: 0.58, ease: "power2.in" }, 3.9);

      /* ── Scene 4 · 4.0–5.2s — dos KPIs reaccionan, dos no ──────────────── */
      // count-up determinista: cada entero se precalcula por fotograma a 30fps
      // y se escribe con tl.set, así cualquier seek muestra el mismo valor.
      var FPS = 30;
      var countEase = gsap.parseEase("sine.inOut");

      function contador(valorSel, lockupSel, desde, hasta, inicio, dur) {
        var last = Math.max(1, Math.round(dur * FPS));
        for (var f = 0; f <= last; f += 1) {
          var v = Math.round(desde + (hasta - desde) * countEase(f / last));
          tl.set(valorSel, { textContent: String(v) }, inicio + dur * (f / last));
        }
        // Un solo pulso contenido al aterrizar en el entero exacto.
        tl.to(lockupSel, { scale: 1.07, duration: 0.16, ease: "power3.out" }, inicio + dur);
        tl.to(lockupSel, { scale: 1, duration: 0.16, ease: "power2.out" }, inicio + dur + 0.16);
      }

      // FUERA DE SERVICIO · 0 → 1 (de 13 activos)
      contador("#clic-val-fuera", "#clic-num-1", 0, 1, 4.1, 0.42);
      tl.fromTo(
        "#clic-mark-1",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.58, ease: "power3.out" },
        4.14
      );

      // REPOSICIÓN · $ 0 → $ 240 M (daño físico)
      contador("#clic-val-repo", "#clic-num-3", 0, 240, 4.24, 0.76);
      tl.fromTo(
        "#clic-suf-repo",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out" },
        4.32
      );
      tl.fromTo(
        "#clic-mark-3",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.58, ease: "power3.out" },
        4.34
      );
      // OPERACIÓN DETENIDA y COSTO DEL EVENTO siguen en cero, quietos: eso es
      // parte del argumento. Todavía no hay cascada.

      /* ── Scene 5 · 5.2–7.0s — la tesis, sola ───────────────────────────── */
      tl.fromTo(
        "#clic-banda",
        { y: 300 },
        { y: 0, duration: 0.7, ease: "power3.out" },
        5.16
      );
      tl.fromTo(
        "#clic-banda-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.72, ease: "power3.out" },
        5.32
      );
      tl.fromTo(
        ".clic-word",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power3.out", stagger: 0.078 },
        5.46
      );
      // …y después quieto. Es una afirmación sin probar; los frames 3 y 4 son
      // la prueba. Sin salida: el corte a frame 03 es la salida.

      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["02-el-clic"] = tl;
    })();
  </script>
