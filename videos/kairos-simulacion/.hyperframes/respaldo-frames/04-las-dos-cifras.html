    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";

        var root = document.getElementById("root");
        var q = function (sel) {
          return root.querySelector(sel);
        };

        /* — QR mosaic: patrón fijo, autoría manual, cero aleatoriedad — */
        var QR_ROWS = [
          "11101011",
          "10100110",
          "11101101",
          "00001010",
          "11010111",
          "01101001",
          "10110110",
          "01011101",
        ];
        var qr = q("#f04-qr");
        for (var r = 0; r < QR_ROWS.length; r += 1) {
          for (var c = 0; c < 8; c += 1) {
            var cell = document.createElement("span");
            if (QR_ROWS[r].charAt(c) === "1") cell.className = "on";
            qr.appendChild(cell);
          }
        }

        var plate = q("#f04-plate");
        var divider = q("#f04-divider");
        var rotuloL = q("#f04-rotulo-l");
        var rotuloR = q("#f04-rotulo-r");
        var jitterL = q("#f04-jitter-l");
        var jitterR = q("#f04-jitter-r");
        var stageL = q("#f04-stage-l");
        var stageR = q("#f04-stage-r");
        var valL = q("#f04-val-l");
        var valR = q("#f04-val-r");
        var sufL = q("#f04-suf-l");
        var sufR = q("#f04-suf-r");
        var bajadaL = q("#f04-bajada-l");
        var bajadaR = q("#f04-bajada-r");
        var dimRule = q("#f04-dim-rule");
        var tickL = q("#f04-tick-l");
        var tickR = q("#f04-tick-r");
        var dimLabel = q("#f04-dim-label");
        var closing = q("#f04-closing");
        var lockup = q("#f04-lockup");
        var markSub = q("#f04-mark-sub");

        var tl = gsap.timeline({ paused: true });

        /* ============================================================
           MOVIMIENTO FIRMA — count-up (counting-dynamic-scale).
           Cada entero visible se precalcula para una posición fija del
           timeline y se escribe con tl.set(): sin onUpdate, sin reloj de
           render; un seek hacia atrás muestra exactamente el mismo valor.
           ============================================================ */
        var FPS = 30;
        var countEase = gsap.parseEase("sine.inOut");

        function mountCount(el, from, to, at, dur) {
          var last = Math.max(1, Math.round(dur * FPS));
          el.textContent = String(Math.round(from));
          for (var i = 0; i <= last; i += 1) {
            var p = i / last;
            var v = String(Math.round(from + (to - from) * countEase(p)));
            tl.set(el, { textContent: v }, at + dur * p);
          }
        }

        /* Estados iniciales que no nacen de un fromTo (evita transform en CSS). */
        gsap.set(lockup, { opacity: 0, scale: 0.72 });

        /* ---------- Escena 1 (0.0–1.2s) · el plano se hunde ---------- */
        tl.fromTo(
          plate,
          { opacity: 0.58 },
          { opacity: 0.12, duration: 1.05, ease: "power2.out" },
          0,
        );
        tl.fromTo(
          plate,
          { scale: 1.06 },
          { scale: 1, duration: 1.3, ease: "power2.out" },
          0,
        );
        tl.fromTo(
          rotuloL,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.3,
        );
        tl.fromTo(
          rotuloR,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.42,
        );
        tl.fromTo(
          divider,
          { scaleY: 0 },
          { scaleY: 1, duration: 0.52, ease: "power3.out" },
          0.62,
        );
        tl.fromTo(
          qr,
          { opacity: 0 },
          { opacity: 1, duration: 0.5, ease: "power2.out" },
          0.95,
        );

        /* ---------- Escena 2 (1.2–3.2s) · arrancan JUNTAS, a distinta velocidad ----------
           Mismo t de arranque (1.20). La izquierda tarda 1.40s, la derecha 2.80s.
           El desfase está en la VELOCIDAD, nunca en el arranque. */
        var START_AT = 1.2;
        var DUR_L = 1.4; // aterriza en 2.60
        var DUR_R = 2.8; // aterriza en 4.00 — 1.4s después
        var LAND_L = START_AT + DUR_L;
        var LAND_R = START_AT + DUR_R;
        var START_SCALE = 0.62;
        var PULSE = 0.165;

        tl.fromTo(
          stageL,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
          START_AT,
        );
        tl.fromTo(
          stageR,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
          START_AT,
        );
        tl.fromTo(
          stageL,
          { scale: START_SCALE },
          { scale: 1, duration: DUR_L, ease: "sine.inOut" },
          START_AT,
        );
        tl.fromTo(
          stageR,
          { scale: START_SCALE },
          { scale: 1, duration: DUR_R, ease: "sine.inOut" },
          START_AT,
        );
        mountCount(valL, 0, 240, START_AT, DUR_L);
        mountCount(valR, 0, 440, START_AT, DUR_R);

        /* La izquierda aterriza y suelta su pulso contenido. */
        tl.to(stageL, { scale: 1.07, duration: PULSE, ease: "power3.out" }, LAND_L);
        tl.to(stageL, { scale: 1, duration: PULSE, ease: "power2.out" }, LAND_L + PULSE);
        tl.fromTo(
          sufL,
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.34, ease: "back.out(1.6)" },
          LAND_L,
        );
        tl.fromTo(
          bajadaL,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
          LAND_L + 0.2,
        );

        /* ---------- Escena 3 (3.2–4.6s) · la derecha sigue trepando y aterriza ---------- */
        tl.to(stageR, { scale: 1.07, duration: PULSE, ease: "power3.out" }, LAND_R);
        tl.to(stageR, { scale: 1, duration: PULSE, ease: "power2.out" }, LAND_R + PULSE);
        tl.fromTo(
          sufR,
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.34, ease: "back.out(1.6)" },
          LAND_R,
        );
        tl.fromTo(
          bajadaR,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
          LAND_R + 0.16,
        );

        /* El filete de cota: mide la distancia entre las dos cifras. */
        tl.fromTo(
          dimRule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.56, ease: "power3.out" },
          4.2,
        );
        tl.fromTo(
          tickL,
          { scaleY: 0 },
          { scaleY: 1, duration: 0.26, ease: "power2.out" },
          4.56,
        );
        tl.fromTo(
          tickR,
          { scaleY: 0 },
          { scaleY: 1, duration: 0.26, ease: "power2.out" },
          4.62,
        );
        tl.fromTo(
          dimLabel,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          4.6,
        );

        /* ---------- Escena 4 (4.6–6.2s) · frame sostenido ----------
           Sólo entra la línea de cierre. Las cifras se quedan quietas: jitter
           de baja amplitud (sine-wave-loop, extremo bajo del rango; dos
           elementos → amplitud por elemento reducida y períodos escalonados),
           sobre wrappers propios para no pisar el transform del pulso. */
        tl.fromTo(
          closing,
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
          4.8,
        );
        tl.to(
          jitterL,
          { y: -1.8, duration: 0.85, ease: "sine.inOut", yoyo: true, repeat: 1 },
          4.55,
        );
        tl.to(
          jitterR,
          { y: -2.1, duration: 0.78, ease: "sine.inOut", yoyo: true, repeat: 1 },
          4.68,
        );

        /* ---------- Escena 5 (6.2–7.0s) · scale-swap-transition ----------
           La línea de cierre se retira (power2.in) y el logotipo llega con peso
           (back.out), solapados 0.15s, mismo footprint y mismo origen. Es el
           último frame del video: éste es su único exit real. */
        var TRIGGER = 6.32;
        var EXIT_DUR = 0.32;
        var ENTER_DUR = 0.45;
        var OVERLAP = 0.12;

        tl.to(
          closing,
          { scale: 0.72, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
          TRIGGER,
        );
        tl.to(
          lockup,
          { scale: 1, opacity: 1, duration: ENTER_DUR, ease: "back.out(1.5)" },
          TRIGGER + EXIT_DUR - OVERLAP,
        );
        tl.fromTo(
          markSub,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" },
          TRIGGER + EXIT_DUR + 0.16,
        );

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["04-las-dos-cifras"] = tl;
      })();
    </script>
