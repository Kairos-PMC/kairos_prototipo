<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F0ECE1;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-finca-en-calma"
        class="scene"
        data-composition-id="01-finca-en-calma"
        data-composition-src="compositions/frames/01-finca-en-calma.html"
        data-start="0"
        data-duration="7.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-el-clic"
        class="scene"
        data-composition-id="02-el-clic"
        data-composition-src="compositions/frames/02-el-clic.html"
        data-start="7"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-la-cascada"
        class="scene"
        data-composition-id="03-la-cascada"
        data-composition-src="compositions/frames/03-la-cascada.html"
        data-start="14"
        data-duration="9.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-las-dos-cifras"
        class="scene"
        data-composition-id="04-las-dos-cifras"
        data-composition-src="compositions/frames/04-las-dos-cifras.html"
        data-start="23"
        data-duration="7"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-finca-en-calma", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.fromTo("#el-02-el-clic", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.to("#el-02-el-clic", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 14);
        tl.fromTo("#el-03-la-cascada", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 14);
        tl.to("#el-03-la-cascada", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.fromTo("#el-04-las-dos-cifras", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
