    <style>
      @font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:block;src:url("assets/fonts/IBMPlexSans-400.woff2") format("woff2");}
      @font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:block;src:url("assets/fonts/IBMPlexSans-600.woff2") format("woff2");}
      @font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:block;src:url("assets/fonts/IBMPlexMono-400.woff2") format("woff2");}

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }

      /* ── Kairos · el montaje del trailer ────────────────────────────────────
         Sesenta segundos. Metraje filmado en la terraza, cuatro piezas ya
         renderizadas, la emisión de Caracol en el televisor y la música.
         Los tiempos salen de docs/video-pitch/escaleta-3min.md.

         Esta pasada es la de acabado. Cada plano quieto lleva un acercamiento
         lento, los cortes que importan llevan golpe, y el 0:46 se cuenta como
         pantalla partida porque el plano 8 no se pudo filmar con luz de día. */
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        --papel: #f0ece1;
        --tinta: #16191d;
        --golpe: #c4372a;
        --enpie: #56c08e;
        --sans: "IBM Plex Sans", Inter, sans-serif;
        --mono: "IBM Plex Mono", monospace;
        background: #000;
      }
      #root *, #root *::before, #root *::after { box-sizing: border-box; }

      video.plano { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
                    object-fit: cover; display: block; z-index: 10; }

      /* Las dos mitades del 0:46. Una parada y la otra operando. */
      video.mitad { position: absolute; top: 0; width: 960px; height: 1080px;
                    object-fit: cover; display: block; z-index: 12; }
      video.izq { left: 0; }
      video.der { left: 960px; }
      /* La línea del 0:46. Va oscura porque las dos mitades son la misma pared
         clara, y sin un corte visible la pantalla partida se lee como un
         encuadre mal hecho en vez de como una decisión. */
      .divisor { position: absolute; left: 954px; top: 0; width: 12px; height: 1080px;
                 background: var(--tinta); z-index: 14;
                 box-shadow: 0 0 44px 10px rgba(9,11,13,.55); }

      /* El hueco del televisor, que todavía no se filma. */
      .hueco {
        position: absolute; inset: 0; z-index: 10; background: var(--tinta);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      }
      .hueco b { font-family: var(--sans); font-weight: 600; font-size: 66px;
                 letter-spacing: .02em; color: #8a9099; }
      .hueco span { font-family: var(--mono); font-size: 30px; color: rgb(95,101,110); }

      /* La emisión, encima del televisor apagado. Va con su marca y su rótulo,
         como cita, y por eso no lleva ningún zócalo nuestro encima. */
      /* La noticia, alineada sobre la pantalla real del televisor filmado.
         Las medidas salen del fotograma: con el recorte crop=2900:1631:458:0
         la pantalla cae en estas coordenadas del cuadro de 1920 por 1080. Va
         con fill y no con cover porque la pantalla quedó en 1,73 y el clip en
         1,78, y es mejor estirar un tres por ciento que dejar un filo de
         reflejo sin tapar. */
      video.noticia { position: absolute; left: 267px; top: 115px; width: 1386px; height: 803px;
                      object-fit: fill; display: block; z-index: 20; }

      /* Los rótulos. Son los que hacen entender que pasó el tiempo entre el
         0:00 y el 0:46. Sin ellos el 0:46 se lee como error de continuidad. */
      .rotulo { position: absolute; left: 140px; top: 858px; z-index: 30;
                font-family: var(--sans); font-weight: 600; font-size: 52px;
                letter-spacing: .2em; color: var(--papel); opacity: 0;
                text-shadow: 0 3px 30px rgba(0,0,0,.85); }
      .barra { position: absolute; left: 140px; top: 826px; width: 118px; height: 5px;
               background: var(--golpe); z-index: 30; transform-origin: 0% 50%; }

      /* El degradado de abajo. Existe para que el rótulo se lea sobre una
         pared clara, y de paso le da peso al pie del cuadro. */
.scrim { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 28;
               opacity: 0;
               background: linear-gradient(to top, rgba(9,11,13,.93) 0%, rgba(9,11,13,.74) 20%, rgba(9,11,13,.34) 40%, rgba(9,11,13,.08) 54%, rgba(9,11,13,0) 66%); }


      /* Las frases que llevan la historia. Un trailer comercial no deja que el
         que mira adivine de qué se trata, se lo dice. Van abajo como los
         rótulos pero en caja baja y más grandes, para que se lean como
         narración y no como un letrero de lugar. */
      .frase { position: absolute; left: 140px; top: 758px; width: 1360px; z-index: 30;
               font-family: var(--sans); font-weight: 600; font-size: 64px; line-height: 1.12;
               letter-spacing: -.012em; color: var(--papel); opacity: 0;
               text-shadow: 0 3px 34px rgba(0,0,0,.8); }


      /* El estado de cada mitad en el 0:46. Las palabras y los colores son los
         de la propia app, donde el rojo es lo que recibió el golpe y el verde
         lo que quedó en pie. Decirlo así ata el final del trailer a la
         pantalla que se acaba de ver, y no promete que Kairos apague
         incendios, que es lo único que no se puede decir. */
      .marca-estado { display: block; font-size: 28px; letter-spacing: .28em; font-weight: 400;
                      color: var(--papel); opacity: .8; margin-bottom: 15px; }
      /* La regla de color sobre cada estado. Es lo que lo vuelve un sello y no
         un pie de foto, y de paso repite el rojo y el verde del producto una
         vez más antes del logotipo. */
      .estado::before { content: ""; position: absolute; left: 50%; top: -26px;
                        width: 104px; height: 5px; margin-left: -52px;
                        background: currentColor; }
      .estado { position: absolute; top: 862px; width: 960px; z-index: 30; text-align: center;
                font-family: var(--sans); font-weight: 600; font-size: 52px;
                letter-spacing: .16em; opacity: 0; text-shadow: 0 3px 30px rgba(0,0,0,.85); }
      .estado-izq { left: 0; color: var(--golpe); }
      .estado-der { left: 960px; color: var(--enpie); }

      .negro { position: absolute; inset: 0; z-index: 40; background: #000; opacity: 0; }
    </style>

        tl.fromTo("#preguntas", { scale: 1.00 }, { scale: 1.05, duration: 10, ease: "none" }, 36);

        /* ── 0:00.7 · TOLIMA, MARZO. La barra se traza y el texto entra. ──── */
        tl.to("#scrim-marzo", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.7);
        tl.to("#barra-marzo", { scaleX: 1, duration: 0.42, ease: "power3.out" }, 0.7);
        tl.to("#rotulo-marzo", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.86);
        tl.to(["#rotulo-marzo", "#barra-marzo", "#scrim-marzo"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 3.9);

        /* ── 0:11 · la emisión entra sobre el televisor ─────────────────────
           El audio del noticiero ya viene sonando desde el 0:08. */
        tl.to("#noticia", { opacity: 1, duration: 0.22, ease: "power2.out" }, 11);
        tl.to("#noticia", { opacity: 0, duration: 0.01 }, 15.98);

        /* ── 0:46 · el golpe de la pantalla partida ────────────────────────
           Las dos mitades aterrizan desde un poco más grandes y la línea se
           abre de un tirón. El impacto cae en el mismo fotograma. */
        tl.to(["#p08izq", "#p08der"], { scale: 1, duration: 0.5, ease: "power3.out" }, 46);
        tl.to("#divisor", { scaleY: 1, duration: 0.38, ease: "power4.out" }, 46);

        /* ── 0:46.7 · TOLIMA, AGOSTO, igual que el de marzo a propósito ──── */
        tl.to("#scrim-agosto", { opacity: 1, duration: 0.5, ease: "power2.out" }, 46.7);
        tl.to("#barra-agosto", { scaleX: 1, duration: 0.42, ease: "power3.out" }, 46.7);
        tl.to("#rotulo-agosto", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 46.86);
        tl.to(["#rotulo-agosto", "#barra-agosto"], { opacity: 0, duration: 0.38, ease: "power2.in" }, 48.05);

        /* ── 0:49 · el estado de cada mitad ────────────────────────────────
           Primero el rótulo dice que es agosto, y recién después se dice qué
           pasó con cada uno. En ese orden, porque el tiempo tiene que haber
           pasado antes de que el resultado signifique algo. */
        tl.fromTo("#est-izq", { opacity: 0, scale: 0.88 },
                  { opacity: 1, scale: 1, duration: 0.46, ease: "back.out(1.9)" }, 48.5);
        tl.fromTo("#est-der", { opacity: 0, scale: 0.88 },
                  { opacity: 1, scale: 1, duration: 0.46, ease: "back.out(1.9)" }, 48.86);
        // Se quedan hasta el corte al logotipo. Son dos líneas y hay que poder
        // leerlas, así que no se van antes: las corta el corte.
        tl.to("#scrim-agosto", { opacity: 0, duration: 0.3, ease: "power2.in" }, 51.7);


        /* ── Las frases ────────────────────────────────────────────────────
           Entran desde abajo, se quedan quietas y se van antes del corte. */
        tl.to("#scrim-f1", { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.5);
        tl.to("#f1", { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 4.58);
        tl.to(["#f1", "#scrim-f1"], { opacity: 0, duration: 0.38, ease: "power2.in" }, 7.68);
        tl.to("#scrim-f2", { opacity: 1, duration: 0.4, ease: "power2.out" }, 16.7);
        tl.to("#f2", { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 16.78);
        tl.to(["#f2", "#scrim-f2"], { opacity: 0, duration: 0.38, ease: "power2.in" }, 19.28);
        tl.to("#scrim-f3", { opacity: 1, duration: 0.4, ease: "power2.out" }, 20.7);
        tl.to("#f3", { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 20.78);
        tl.to(["#f3", "#scrim-f3"], { opacity: 0, duration: 0.38, ease: "power2.in" }, 23.48);
        tl.to("#scrim-f4", { opacity: 1, duration: 0.4, ease: "power2.out" }, 25.1);
        tl.to("#f4", { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 25.18);
        tl.to(["#f4", "#scrim-f4"], { opacity: 0, duration: 0.38, ease: "power2.in" }, 28.78);
        tl.to("#scrim-f5", { opacity: 1, duration: 0.4, ease: "power2.out" }, 30.9);
        tl.to("#f5", { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 30.98);
        tl.to(["#f5", "#scrim-f5"], { opacity: 0, duration: 0.38, ease: "power2.in" }, 33.08);

        /* ── 0:58 · negro, el respiro antes del pitch ─────────────────────── */
        tl.to("#negro", { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 57.85);

        // La duración la manda el root.
        tl.to({}, { duration: 60 }, 0);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
