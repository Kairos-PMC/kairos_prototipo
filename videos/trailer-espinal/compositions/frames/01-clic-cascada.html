<template>
  <style>
    @font-face{font-family:"IBM Plex Serif";font-style:normal;font-weight:400;font-display:block;src:url("assets/fonts/IBMPlexSerif-400.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:block;src:url("assets/fonts/IBMPlexSans-400.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:block;src:url("assets/fonts/IBMPlexSans-600.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:block;src:url("assets/fonts/IBMPlexMono-400.woff2") format("woff2");}

    /* ── Kairos · el clic y la cascada, El Espinal ──────────────────────────
       Mismo sistema que videos/kairos-simulacion: papel con retícula, dos
       filetes de tinta, y el código de estado del plano, que no es
       decorativo. Azul = opera · bermellón = recibió el golpe · ocre = dejó
       de operar sin recibirlo. Sin sombras blandas, sin gradientes, y el
       único rebote es el release del clic. */
    #root {
      position: absolute; inset: 0; overflow: hidden; isolation: isolate; container-type: size;
      --papel: #f0ece1;
      --tinta: #16191d;
      --tinta-media: #55606d;
      --linea: rgba(205, 198, 181, 0.55);
      --golpe: #c4372a;
      --arrastrado: #a8710c;
      /* El ocre del plano a 17px sobre papel da 3.54:1 y no se lee en
         proyector. Para TEXTO se usa esta variante, mismo tono y un paso más
         oscura; el #a8710c exacto queda para la muestra de color. */
      --arrastrado-texto: #91610a;
      --serif: "IBM Plex Serif", Georgia, serif;
      --sans: "IBM Plex Sans", Inter, sans-serif;
      --mono: "IBM Plex Mono", monospace;
      font-family: var(--sans); color: var(--tinta);
    }
    #root *, #root *::before, #root *::after { box-sizing: border-box; }

    .ground {
      position: absolute; inset: 0; z-index: 0;
      background-color: var(--papel);
      background-image:
        linear-gradient(to right, var(--linea) 0 1px, transparent 1px 100%),
        linear-gradient(to bottom, var(--linea) 0 1px, transparent 1px 100%);
      background-size: 38.4px 38.4px;
    }

    .hair { position: absolute; left: 76.8px; width: 1766.4px; height: 2.3px; background: var(--tinta); z-index: 50; }
    .hair-top { top: 58px; }
    .hair-bottom { top: 1022px; }

    /* ── franja de KPIs ───────────────────────────────────────────────────
       overflow hidden a propósito: las tarjetas entran deslizando desde
       debajo del filete, no apareciendo por opacidad. Una tarjeta a media
       opacidad sobre papel no alcanza el contraste mínimo en proyector. */
    .kpis { position: absolute; left: 76.8px; top: 82px; width: 1766.4px; height: 98px; z-index: 40; overflow: hidden; }
    .kpi-rule { position: absolute; left: 0; top: 0; width: 1766.4px; height: 2.3px; background: var(--tinta); transform-origin: 0% 50%; z-index: 2; }
    .kpi { position: absolute; top: 2.3px; width: 441.6px; height: 95.7px; padding: 12px 18px 0 18px; }
    .kpi-1 { left: 0; } .kpi-2 { left: 441.6px; } .kpi-3 { left: 883.2px; } .kpi-4 { left: 1324.8px; }
    .kpi-ink { background: var(--tinta); color: var(--papel); }
    .div { position: absolute; top: 14px; width: 1px; height: 70px; background: rgba(139,149,161,.55); }

    .kpi-label { font-weight: 600; font-size: 15px; line-height: 1.2; letter-spacing: .16em;
                 text-transform: uppercase; color: var(--tinta-media); white-space: nowrap; }
    .kpi-ink .kpi-label { color: rgba(240,236,225,.78); }
    .kpi-figure { display: flex; align-items: baseline; gap: 22px; margin-top: 4px; }
    .num { display: flex; align-items: baseline; min-width: 150px; font-family: var(--serif);
           font-size: 52px; line-height: 1; letter-spacing: -.015em;
           font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
           color: var(--tinta); white-space: nowrap; transform-origin: 0% 58%; }
    .kpi-ink .num { color: var(--papel); }
    .affix { font-size: .6em; letter-spacing: 0; color: var(--tinta-media); }
    .kpi-ink .affix { color: rgba(240,236,225,.78); }
    .pre { margin-right: .34em; } .suf { margin-left: .34em; }
    .kpi-sub { font-family: var(--mono); font-size: 17px; line-height: 1; letter-spacing: .05em;
               color: var(--tinta-media); white-space: nowrap; }
    .kpi-ink .kpi-sub { color: rgba(240,236,225,.78); }
    .sub-slot { position: relative; min-width: 220px; height: 18px; }
    .sub-slot .kpi-sub { position: absolute; left: 0; top: 0; }
    .sub-ocre { color: var(--arrastrado-texto); }
    .kpi-mark { position: absolute; bottom: 0; left: 0; width: 441.6px; height: 2.3px;
                background: var(--tinta); transform-origin: 0% 50%; z-index: 3; }
    .kpi-mark-pale { background: var(--papel); }

    /* ── el plano ─────────────────────────────────────────────────────────── */
    .plano { position: absolute; left: 415px; top: 186px; width: 1090px; height: 760px; z-index: 10; }
    .plano svg { display: block; width: 1090px; height: 760px; }
    .m-line { fill: none; stroke: #fff; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }

    /* ── onda del clic: cuadrada, el sistema no tiene radios ──────────────── */
    .onda { position: absolute; left: 692.4px; top: 424.1px; width: 108px; height: 108px;
            margin-left: -54px; margin-top: -54px; border: 2.3px solid var(--tinta);
            opacity: 0; z-index: 60; pointer-events: none; }

    .cursor { position: absolute; left: 0; top: 0; width: 100px; height: 100px; z-index: 70; pointer-events: none; }
    .cursor svg { display: block; width: 100%; height: 100%; fill: var(--tinta);
                  stroke: var(--papel); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }

    .chips { position: absolute; left: 415px; top: 966px; display: flex; gap: 40px; z-index: 45; }
    .chip { display: flex; align-items: center; gap: 11px; }
    .swatch { width: 16px; height: 16px; display: block; }
    .chip-label { font-weight: 600; font-size: 16px; letter-spacing: .13em; text-transform: uppercase;
                  color: var(--tinta-media); white-space: nowrap; }
  </style>

  <div id="root" data-composition-id="01-clic-cascada" data-duration="12" data-width="1920" data-height="1080">

    <div class="clip ground" data-start="0" data-duration="12" data-track-index="0"></div>

    <!-- el plano: dos plates alineados pixel a pixel, el de caída enmascarado -->
    <div class="clip plano" id="plano" data-start="0" data-duration="12" data-track-index="1">
      <svg viewBox="0 0 1772 1235" width="1090" height="760" aria-hidden="true">
        <defs>
          <mask id="tr-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1772" height="1235">
            <!-- la bodega nace en el punto del clic y se abre a su rectángulo -->
            <rect id="m-bodega" x="451" y="387" width="0" height="0" fill="#fff" />
            <!-- las dos líneas de dependencia, calcadas del trazo real de la app -->
            <path id="m-l1" class="m-line" pathLength="1000"
                  d="M451 387 L700 352 L772 336 L868 332 L940 332 L1000 335 L1035 338" />
            <path id="m-l2" class="m-line" pathLength="1000"
                  d="M451 387 L700 500 L772 546 L844 594 L892 628 L940 662 L975 688" />
            <!-- los dos arrastrados nacen donde aterriza cada línea -->
            <rect id="m-patio" x="1031" y="338" width="0" height="0" fill="#fff" />
            <rect id="m-secado" x="966" y="693" width="0" height="0" fill="#fff" />
          </mask>
        </defs>
        <image href="assets/plates/plano-antes@2x.png" x="0" y="0" width="1772" height="1235" />
        <image href="assets/plates/plano-caido@2x.png" x="0" y="0" width="1772" height="1235" mask="url(#tr-mask)" />
      </svg>
    </div>

    <div class="clip kpis" data-start="0" data-duration="12" data-track-index="2">
      <div class="kpi-rule" id="kpi-rule"></div>
      <div class="div" id="div-a" style="left: 441.6px"></div>
      <div class="div" id="div-b" style="left: 883.2px"></div>

      <div class="kpi kpi-1" id="kpi-1">
        <div class="kpi-label">Fuera de servicio</div>
        <div class="kpi-figure">
          <div class="num" id="num-1"><span id="v-fuera">0</span></div>
          <div class="sub-slot">
            <div class="kpi-sub" id="sub-total">de 20 activos</div>
            <div class="kpi-sub sub-ocre" id="sub-ocre">2 sin recibir daño</div>
          </div>
        </div>
      </div>

      <div class="kpi kpi-2" id="kpi-2">
        <div class="kpi-label">Operación detenida</div>
        <div class="kpi-figure">
          <div class="num" id="num-2"><span id="v-oper">0</span><span class="affix suf">%</span></div>
          <div class="kpi-sub">$ 12 M por día</div>
        </div>
      </div>

      <div class="kpi kpi-3" id="kpi-3">
        <div class="kpi-label">Reposición</div>
        <div class="kpi-figure">
          <div class="num" id="num-3"><span class="affix pre">$</span><span id="v-repo">0</span><span class="affix suf" id="suf-repo">M</span></div>
          <div class="kpi-sub">35 días de reparación</div>
        </div>
      </div>

      <div class="kpi kpi-4 kpi-ink" id="kpi-4">
        <div class="kpi-label">Costo del evento</div>
        <div class="kpi-figure">
          <div class="num" id="num-4"><span class="affix pre">$</span><span id="v-costo">0</span><span class="affix suf" id="suf-costo">M</span></div>
          <div class="kpi-sub">+ lucro cesante</div>
        </div>
      </div>

      <div class="kpi-mark" id="mark-1" style="left: 0"></div>
      <div class="kpi-mark" id="mark-3" style="left: 883.2px"></div>
      <div class="kpi-mark kpi-mark-pale" id="mark-4" style="left: 1324.8px"></div>
    </div>

    <div class="clip hair hair-top" data-start="0" data-duration="12" data-track-index="3"></div>
    <div class="clip hair hair-bottom" data-start="0" data-duration="12" data-track-index="4"></div>

    <div class="clip onda" id="onda-1" data-start="0" data-duration="12" data-track-index="5"></div>
    <div class="clip onda" id="onda-2" data-start="0" data-duration="12" data-track-index="6"></div>

    <div class="clip cursor" id="cursor" data-start="0" data-duration="12" data-track-index="7" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 3 L5 19 L9 15 L12 22 L15 20.5 L11.5 14 L18 14 Z" />
      </svg>
    </div>

    <div class="clip chips" data-start="0" data-duration="12" data-track-index="8">
      <div class="chip" id="chip-1">
        <span class="swatch" style="background: #c4372a"></span>
        <span class="chip-label">Recibió el golpe</span>
      </div>
      <div class="chip" id="chip-2">
        <span class="swatch" style="background: #a8710c"></span>
        <span class="chip-label">Dejó de operar sin recibirlo</span>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";
      var tl = gsap.timeline({ paused: true });

      /* ─────────────────────────────────────────────────────────────────────
         Geometría medida sobre los plates (@2x, alineados pixel a pixel,
         recortados del bbox del SVG del plano en la app corriendo a 1440 de
         ancho). El bbox daba 1772x1514; los plates se recortan a 1772x1235
         para dejar fuera el cajetín, donde la app encima el nombre del
         cliente sobre la cota. El plano se dibuja a 1090 x 760 con origen
         (415, 186), así que la escala es 1090/1772 = 0.61512.

         El punto del clic es el centro del icono de la Bodega principal: en
         unidades de plano (23, 18), en el plate (451, 387), y en cuadro
         415 + 451*0.61512 = 692.4 · 186 + 387*0.61512 = 424.1

         Las dos polilíneas de la máscara están calcadas del trazo real: la
         app no une los centros de los iconos sino sus bordes, y las líneas
         salen curvadas. Medirlas contra el diff de los dos plates fue la
         única forma de que la banda de revelado no manche las cajas.

         El rectángulo de la bodega llega a x=762 y no más: ahí termina el
         filete de la caja. Un píxel más y al hacer clic ya asomarían las dos
         líneas fuera de la caja, que es justo lo que el trazado de 5.4s
         tiene que contar.
         ──────────────────────────────────────────────────────────────────── */
      var CLICK_X = 692.4, CLICK_Y = 424.1;

      var cursor = document.getElementById("cursor");
      var plano = document.getElementById("plano");

      // La punta de la flecha vive en (21%, 14%) de su caja: se ancla una sola
      // vez para que todo x/y posterior coloque la PUNTA, no la caja.
      gsap.set(cursor, { xPercent: -21, yPercent: -14, transformOrigin: "21% 14%" });
      gsap.set(plano, { transformOrigin: "277.4px 238.1px" }); // el punto del clic, dentro del plano

      /* ── estado en t=0 ─────────────────────────────────────────────────
         Línea base explícita. Un seek a cualquier t anterior a un beat tiene
         que encontrar el estado de reposo, no el que dejó el último fromTo
         escrito: immediateRender se aplica al autorar, no en su posición. */
      tl.set("#kpi-rule", { scaleX: 0 }, 0);
      tl.set(["#kpi-1", "#kpi-2", "#kpi-3", "#kpi-4"], { y: -104 }, 0);
      tl.set(["#div-a", "#div-b"], { opacity: 0 }, 0);
      tl.set(["#mark-1", "#mark-3", "#mark-4"], { scaleX: 0 }, 0);
      tl.set(["#suf-repo", "#suf-costo", "#sub-ocre"], { opacity: 0 }, 0);
      tl.set(["#chip-1", "#chip-2"], { opacity: 0 }, 0);
      tl.set(["#onda-1", "#onda-2"], { scale: 1, opacity: 0 }, 0);
      tl.set(cursor, { x: 2080, y: 700, scale: 1 }, 0);
      tl.set("#m-bodega", { attr: { x: 451, y: 387, width: 0, height: 0 } }, 0);
      tl.set("#m-patio", { attr: { x: 1031, y: 338, width: 0, height: 0 } }, 0);
      tl.set("#m-secado", { attr: { x: 966, y: 693, width: 0, height: 0 } }, 0);
      tl.set(["#m-l1", "#m-l2"], { attr: { "stroke-dasharray": 1000, "stroke-dashoffset": 1000 } }, 0);
      // El plano y los filetes ya están puestos en el fotograma 0: el primer
      // fotograma tiene que decir de qué es la lámina, no estar en blanco.

      /* ── 0.1–1.3s · entra la franja de medición ────────────────────────── */
      tl.to("#kpi-rule", { scaleX: 1, duration: 0.74, ease: "power3.out" }, 0.1);
      ["#kpi-1", "#kpi-2", "#kpi-3", "#kpi-4"].forEach(function (sel, i) {
        tl.to(sel, { y: 0, duration: 0.7, ease: "power3.out" }, 0.18 + i * 0.13);
      });
      tl.to(["#div-a", "#div-b"], { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.92);

      /* ── 2.0–3.4s · el cursor entra por la derecha ─────────────────────
         Una sola vectorial continua: x e y con eases distintos dan la curva. */
      tl.fromTo(cursor, { x: 2080 },
        { x: CLICK_X, duration: 1.4, ease: "power1.inOut", immediateRender: false }, 2.0);
      tl.fromTo(cursor, { y: 700 },
        { y: CLICK_Y, duration: 1.4, ease: "power3.inOut", immediateRender: false }, 2.0);

      /* ── 3.4–3.9s · el movimiento firma: el clic ───────────────────────── */
      var CLICK_AT = 3.4, PRESS = 0.12, IGNITE = CLICK_AT + PRESS;

      tl.to(cursor, { scale: 0.86, duration: PRESS, ease: "power2.in" }, CLICK_AT);
      tl.to(plano, { scale: 0.978, duration: PRESS, ease: "power2.in" }, CLICK_AT);

      // La ignición: la bodega se revela del plate caído radiando desde el
      // punto del clic. Azul pasa a bermellón, con su trama y su X.
      tl.to("#m-bodega", { attr: { x: 140, y: 115, width: 622, height: 495 },
                           duration: 0.3, ease: "power3.out" }, IGNITE);
      tl.to(cursor, { scale: 1, duration: 0.5, ease: "back.out(1.7)" }, IGNITE);
      tl.to(plano, { scale: 1, duration: 0.5, ease: "back.out(1.7)" }, IGNITE);

      // Onda expansiva cuadrada. El filete es tinta: el bermellón sólo lo
      // puede usar una instalación.
      tl.fromTo(["#onda-1", "#onda-2"], { scale: 1, opacity: 0.5 },
        { scale: 2.7, opacity: 0, duration: 0.68, ease: "power2.out", stagger: 0.1, immediateRender: false },
        IGNITE);

      tl.to(cursor, { x: CLICK_X + 104, y: CLICK_Y + 74, duration: 0.42, ease: "power2.out" }, 3.9);
      tl.to(cursor, { x: 2120, y: 880, duration: 0.6, ease: "power2.in" }, 4.4);

      /* ── contadores deterministas ──────────────────────────────────────
         Cada entero se precalcula por fotograma a 30fps y se escribe con
         tl.set, así cualquier seek muestra el mismo valor. Nada de onUpdate:
         seek() suprime los callbacks y al renderizar fotograma a fotograma la
         cifra no se pintaría. */
      var FPS = 30;
      var easeCount = gsap.parseEase("sine.inOut");
      function contador(valorSel, lockupSel, desde, hasta, inicio, dur) {
        var last = Math.max(1, Math.round(dur * FPS));
        for (var f = 0; f <= last; f += 1) {
          var v = Math.round(desde + (hasta - desde) * easeCount(f / last));
          tl.set(valorSel, { textContent: String(v) }, inicio + dur * (f / last));
        }
        tl.to(lockupSel, { scale: 1.07, duration: 0.16, ease: "power3.out" }, inicio + dur);
        tl.to(lockupSel, { scale: 1, duration: 0.16, ease: "power2.out" }, inicio + dur + 0.16);
      }

      /* ── 3.9–4.9s · el golpe directo, y nada más ───────────────────────── */
      contador("#v-fuera", "#num-1", 0, 1, 3.92, 0.42);
      tl.to("#mark-1", { scaleX: 1, duration: 0.58, ease: "power3.out" }, 3.96);

      contador("#v-repo", "#num-3", 0, 420, 4.08, 0.82);
      tl.to("#suf-repo", { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.18);
      tl.to("#mark-3", { scaleX: 1, duration: 0.58, ease: "power3.out" }, 4.2);
      // Operación detenida y Costo del evento siguen en cero y quietos. Eso es
      // parte del argumento: todavía no hay cascada.

      /* ── 5.4–7.5s · la cascada ─────────────────────────────────────────── */
      tl.to("#m-l1", { attr: { "stroke-dashoffset": 0 }, duration: 0.72, ease: "power2.inOut" }, 5.4);
      tl.to("#m-patio", { attr: { x: 800, y: 115, width: 480, height: 382 },
                          duration: 0.32, ease: "power3.out" }, 6.12);
      contador("#v-fuera", "#num-1", 1, 2, 6.2, 0.26);

      tl.to("#m-l2", { attr: { "stroke-dashoffset": 0 }, duration: 0.78, ease: "power2.inOut" }, 5.74);
      tl.to("#m-secado", { attr: { x: 800, y: 505, width: 380, height: 330 },
                           duration: 0.32, ease: "power3.out" }, 6.52);
      contador("#v-fuera", "#num-1", 2, 3, 6.6, 0.26);

      // La bajada cambia de "de 20 activos" a lo que de verdad importa.
      tl.to("#sub-total", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 6.98);
      tl.to("#sub-ocre", { opacity: 1, duration: 0.42, ease: "power2.out" }, 7.1);

      /* ── 7.6–9.2s · las dos cifras que la cascada destapa ───────────────── */
      contador("#v-oper", "#num-2", 0, 21, 7.6, 0.72);
      contador("#v-costo", "#num-4", 0, 851, 8.05, 1.1);
      tl.to("#suf-costo", { opacity: 1, duration: 0.3, ease: "power2.out" }, 8.2);
      tl.to("#mark-4", { scaleX: 1, duration: 0.6, ease: "power3.out" }, 8.3);

      /* ── 9.3–12.0s · el código de color, y quieto ──────────────────────── */
      tl.to(["#chip-1", "#chip-2"], { opacity: 1, duration: 0.5, ease: "power2.out", stagger: 0.14 }, 9.3);
      // Y después quieto. El corte lo pone el montaje del trailer.
      tl.to({}, { duration: 12 }, 0);

      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["01-clic-cascada"] = tl;
    })();
  </script>
</template>
