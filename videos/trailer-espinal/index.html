<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f0ece1; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Kairos · plano 0:24 del trailer. Doce segundos, mudos, de una sola
         toma: el clic sobre la Bodega principal del Centro de acopio El
         Espinal y la cascada que arrastra. Va debajo de música dentro del
         trailer, así que no lleva voz en off ni SFX. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div
        id="el-01-clic-cascada"
        class="scene"
        data-composition-id="01-clic-cascada"
        data-composition-src="compositions/frames/01-clic-cascada.html"
        data-start="0"
        data-duration="12"
        data-track-index="0"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];
        tl.to({}, { duration: 12 }, 0); // ancla de duración total
      })();
    </script>
  </body>
</html>
